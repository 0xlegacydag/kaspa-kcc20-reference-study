[workspace]
members = ["crates/node-gate", "crates/kcc20-family", "crates/checks"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "ISC"
publish = false

[workspace.dependencies]
# The same revisions the KCC-20 reference pins: compiler, runtime and consensus stay aligned.
argent = { git = "https://github.com/argent-lang/argent", rev = "9a9f4b107116d0b259fae629f200fa3b663e7e9d" }
argent-runtime = { git = "https://github.com/argent-lang/argent", rev = "9a9f4b107116d0b259fae629f200fa3b663e7e9d" }
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "3ed973335b59269293564805cc2c58a14595ec03", package = "silverscript-lang" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", rev = "a41a333b08848f41bf737b72592e463a6011b8ac" }
blake3 = "1.8.7"
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
faster-hex = "0.10"
thiserror = "2"
tempfile = "3"
blake2b_simd = "1.0.2"
node-gate = { path = "crates/node-gate" }
kcc20-family = { path = "crates/kcc20-family" }
